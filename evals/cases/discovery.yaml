cases:
  - id: discover-services
    category: discovery
    tags:
      - token-efficiency
      - type-filter
    prompt: |
      Which systemd services are available?
    expected:
      required:
        - kind: unit_discovery
          type: service
      acceptable: []
      answer:
        semantics:
          - reports the available service units
    forbidden:
      calls:
        - kind: tool
          name: list_unit_types
      answer:
        semantics: []
    notes: |
      The requested unit type is already known. Discovery may be realized by
      list_units or by harness-native Resource discovery. Calling
      list_unit_types adds no decision value.

  - id: discover-units
    category: discovery
    tags:
      - token-efficiency
    prompt: |
      Which systemd units are currently known?
    expected:
      required:
        - kind: unit_discovery
      acceptable: []
      answer:
        semantics:
          - reports units known on the host
    forbidden:
      calls: []
      answer:
        semantics: []
    notes: |
      No type filter is needed because the user asked for all supported unit types.

  - id: discover-user-services
    category: discovery
    tags:
      - user-scope
      - type-filter
    prompt: |
      Which services does testuser have?
    expected:
      required:
        - kind: unit_discovery
          type: service
          user: testuser
      acceptable: []
      answer:
        semantics:
          - reports services belonging to testuser's service manager
    forbidden:
      calls: []
      answer:
        semantics: []
    notes: |
      Tests whether user-scoped discovery is understood without depending on
      the harness-specific mechanism used to enumerate Resources.
